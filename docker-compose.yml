services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anime}
      POSTGRES_DB: ${POSTGRES_DB:-anime}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anime}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anime}:${POSTGRES_PASSWORD:-anime}@db:5432/${POSTGRES_DB:-anime}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_MODEL_LIGHT: ${ANTHROPIC_MODEL_LIGHT:-claude-haiku-4-5-20251001}
      JIMAKU_API_TOKEN: ${JIMAKU_API_TOKEN:-}
      VOICEVOX_URL: ${VOICEVOX_URL:-http://host.docker.internal:50021}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REQUIRE_AUTH: "true"
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
