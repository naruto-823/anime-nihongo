name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e './backend[dev]'
      - run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run lint && npm run build
        working-directory: mobile

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://narutoooo.com
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail
            cd "$HOME/anime-nihongo"
            git fetch origin main:refs/remotes/origin/main
            git checkout -B main origin/main
            git reset --hard origin/main
            sudo docker compose build
            sudo docker compose up -d --remove-orphans
            sudo docker compose restart caddy
            for attempt in $(seq 1 30); do
              if sudo docker compose exec -T app python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"; then
                exit 0
              fi
              sleep 2
            done
            sudo docker compose logs --tail=100 app caddy
            exit 1
          REMOTE

      - name: Public health check
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 3 https://api.narutoooo.com/api/health
          curl --fail --retry 20 --retry-all-errors --retry-delay 5 https://narutoooo.com/

      - name: Show gateway logs on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'cd "$HOME/anime-nihongo" && sudo docker compose logs --tail=150 caddy'
