name: Build native preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-preview.yml"

concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install dependencies
        run: npm ci
        working-directory: native
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
        working-directory: native
      - name: Build installable APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: native/android
      - name: Collect artifact
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk anime-nihongo-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: anime-nihongo-android-preview-${{ github.sha }}
          path: anime-nihongo-preview.apk
          retention-days: 30
          if-no-files-found: error
