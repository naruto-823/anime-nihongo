name: Authorize macro-influencer deploy key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts

      - name: Authorize project key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          MACRO_PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINOAT0s3xJDD5hG7yiS6b0BzpBhOW3uti7mjgyJchgAo github-actions-macro-influencer
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' -- "$MACRO_PUBLIC_KEY" <<'REMOTE'
            set -euo pipefail
            public_key="$1"
            if ! id deploy >/dev/null 2>&1; then
              sudo useradd --create-home --shell /bin/bash deploy
            fi
            random_password="$(openssl rand -base64 48)"
            password_hash="$(openssl passwd -6 "$random_password")"
            sudo usermod --password "$password_hash" deploy
            unset random_password password_hash
            sudo usermod -aG docker deploy
            current_groups="$(id -Gn | tr ' ' ',')"
            sudo usermod -aG "$current_groups" deploy
            sudo install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
            sudo touch /home/deploy/.ssh/authorized_keys
            if ! sudo grep -qxF "$public_key" /home/deploy/.ssh/authorized_keys; then
              printf '%s\n' "$public_key" | sudo tee -a /home/deploy/.ssh/authorized_keys >/dev/null
            fi
            sudo chown deploy:deploy /home/deploy/.ssh/authorized_keys
            sudo chmod 600 /home/deploy/.ssh/authorized_keys
            for ssh_config in /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf; do
              [ -f "$ssh_config" ] || continue
              sudo sed -E -i '/^[[:space:]]*AllowUsers[[:space:]]/ { /(^|[[:space:]])deploy([[:space:]]|$)/! s/$/ deploy/; }' "$ssh_config"
              sudo sed -E -i '/^[[:space:]]*AllowGroups[[:space:]]/ { /(^|[[:space:]])deploy([[:space:]]|$)/! s/$/ deploy/; }' "$ssh_config"
            done
            sudo sshd -t
            sudo systemctl reload ssh || sudo systemctl reload sshd
            sudo sshd -T -C user=deploy,host=localhost,addr=127.0.0.1 | grep -E '^(pubkeyauthentication|authorizedkeysfile|allowusers|allowgroups|denyusers|denygroups|strictmodes) '
            sudo journalctl -u ssh -n 100 --no-pager | grep 'deploy' | tail -n 10 || true
            printf 'macro deploy user ready\n'
          REMOTE
